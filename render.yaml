services:
  - type: web
    name: folga-manager
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build && npm prune --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TZ
        value: America/Sao_Paulo
      - key: DB_POOL_MAX
        value: "5"
      - key: DATABASE_URL
        sync: false
      - key: COMPANY_AUTH_RESOLVER_ROLE
        sync: false
